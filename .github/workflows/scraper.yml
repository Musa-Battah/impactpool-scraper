name: Impactpool Job Scraper

on:
  schedule:
    # 9 AM Nigerian Time (WAT) = 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull latest changes
      run: git pull --rebase
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        if [ ! -f /usr/bin/google-chrome ]; then
          sudo ln -s /usr/bin/chromium-browser /usr/bin/google-chrome
        fi
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pandas webdriver-manager
    
    - name: Run Impactpool scraper
      id: scraper
      run: |
        python v31.py
        
        # Get the generated CSV filename
        CSV_FILE=$(ls impactpool_jobs_*.csv 2>/dev/null | head -1)
        echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV
        echo "Found CSV: $CSV_FILE"
    
    - name: Save updated history to repository
      run: |
        git config user.name "GitHub Actions"
        git config.user email "actions@github.com"
        
        git add scraped_jobs_history.json
        
        git diff --staged --quiet || git commit -m "Update scraped jobs history - $(date '+%Y-%m-%d %H:%M') [skip ci]"
        
        # Pull latest changes before push
        git pull --rebase
        
        # Push with retry
        for attempt in 1 2 3; do
          echo "Push attempt $attempt..."
          if git push; then
            echo "✅ Push succeeded on attempt $attempt"
            break
          else
            echo "⚠️ Push failed (attempt $attempt), waiting 5 seconds..."
            sleep 5
            git pull --rebase
          fi
          
          if [ $attempt -eq 3 ]; then
            echo "❌ Push failed after 3 attempts"
            exit 1
          fi
        done
    
    - name: Upload CSV artifact
      uses: actions/upload-artifact@v4
      with:
        name: scraped-jobs-${{ github.run_id }}
        path: impactpool_jobs_*.csv
        retention-days: 30
    
    - name: Send email report
      if: success() && env.CSV_FILE != ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Impactpool Jobs - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: Impactpool Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ✅ Impactpool job scraper completed successfully!
          
          📊 Run Details:
          - Time: $(date '+%Y-%m-%d %H:%M:%S') Nigerian Time
          - Run Number: ${{ github.run_number }}
          - CSV File: ${{ env.CSV_FILE }}
          
          📁 CSV file is attached.
          
          🔗 View history file:
          https://github.com/${{ github.repository }}/blob/main/scraped_jobs_history.json
        attachments: ${{ env.CSV_FILE }}
    
    - name: Send no-results email
      if: success() && env.CSV_FILE == ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "📭 Impactpool - No New Jobs - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: Impactpool Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          📭 Impactpool scraper ran but found NO new jobs.
          
          📊 Run Details:
          - Time: $(date '+%Y-%m-%d %H:%M:%S') Nigerian Time
          - Run Number: ${{ github.run_number }}
          
          This is normal. The scraper will check again tomorrow.
    
    - name: Send failure notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ Impactpool Scraper FAILED - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: Impactpool Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ❌ The Impactpool job scraper has failed!
          
          🔍 Check the error log:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
