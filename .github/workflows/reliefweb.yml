name: ReliefWeb Nigeria Jobs Scraper

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull latest changes
      run: git pull --rebase
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p job_outputs
    
    - name: Run ReliefWeb scraper
      id: scraper
      run: |
        python v13.py
        
        CSV_FILE=$(ls job_outputs/nigeria_jobs_*.csv 2>/dev/null | head -1)
        REVIEW_FILE=$(ls job_outputs/nigeria_jobs_review_needed_*.csv 2>/dev/null | head -1)
        
        echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV
        echo "REVIEW_FILE=$REVIEW_FILE" >> $GITHUB_ENV
        
        if [ -n "$CSV_FILE" ]; then
          echo "✅ Found CSV: $CSV_FILE"
        else
          echo "ℹ️ No new jobs with valid locations"
        fi
        
        if [ -n "$REVIEW_FILE" ]; then
          echo "⚠️ Found review file: $REVIEW_FILE"
        fi
    
    - name: Save state and processed IDs to repository
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add job_outputs/last_run_state.json
        git add job_outputs/_processed_ids.txt
        git diff --staged --quiet || git commit -m "Update ReliefWeb state and processed IDs [skip ci]"
        git pull --rebase
        for attempt in 1 2 3; do
          echo "Push attempt $attempt..."
          if git push; then
            echo "✅ Push succeeded on attempt $attempt"
            break
          else
            echo "⚠️ Push failed (attempt $attempt), waiting 5 seconds..."
            sleep 5
            git pull --rebase
          fi
          if [ $attempt -eq 3 ]; then
            echo "❌ Push failed after 3 attempts"
            exit 1
          fi
        done
    
    # ⭐ Send CSV to WordPress with SSL fix (-k flag)
    - name: Send CSV to WordPress
      if: env.CSV_FILE != ''
      run: |
        WP_URL="https://oakjobs.online"
        echo "📤 Sending ReliefWeb CSV to WordPress..."
        
        RESPONSE=$(curl -s -k -w "\n%{http_code}" -X POST \
          "$WP_URL/wp-json/csv/v1/import" \
          -H "Content-Type: text/csv" \
          -H "X-API-Key: ${{ secrets.WP_API_KEY }}" \
          --data-binary "@${{ env.CSV_FILE }}" \
          --max-time 60)
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        echo "HTTP Status: $HTTP_CODE"
        echo "Response: $BODY"
        
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ ReliefWeb CSV successfully sent to WordPress!"
        else
          echo "⚠️ Warning: WordPress returned HTTP $HTTP_CODE"
          echo "Response body: $BODY"
        fi
    
    - name: Trigger Impactpool workflow
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: 'Musa-Battah',
            repo: 'impactpool-scraper',
            workflow_id: 'scraper.yml',
            ref: 'main'
          })
          console.log('✅ Impactpool workflow triggered successfully')
    
    - name: Upload CSV artifact
      if: env.CSV_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: reliefweb-jobs-${{ github.run_id }}
        path: ${{ env.CSV_FILE }}
        retention-days: 30
    
    - name: Upload review file artifact
      if: env.REVIEW_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: reliefweb-review-${{ github.run_id }}
        path: ${{ env.REVIEW_FILE }}
        retention-days: 30
    
    - name: Send email with CSV results
      if: success() && env.CSV_FILE != ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🌍 ReliefWeb Nigeria Jobs - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ✅ ReliefWeb Nigeria job scraper completed successfully!
          
          📊 Run Details:
          - Time: $(date '+%Y-%m-%d %H:%M:%S') Nigerian Time
          - Run Number: ${{ github.run_number }}
          
          📁 CSV file attached.
          
          🔄 CSV sent to WordPress: https://oakjobs.online
          🔄 Impactpool triggered and will run shortly.
        attachments: ${{ env.CSV_FILE }}
    
    - name: Send no-results email
      if: success() && env.CSV_FILE == '' && env.REVIEW_FILE != ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "⚠️ ReliefWeb - No Valid Locations Found - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ⚠️ ReliefWeb scraper ran but found NO jobs with valid Nigerian cities.
          
          🔄 Impactpool scraper will still run.
    
    - name: Send no-jobs-at-all email
      if: success() && env.CSV_FILE == '' && env.REVIEW_FILE == ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "📭 ReliefWeb - No Jobs Found - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          📭 ReliefWeb scraper ran but found NO new jobs at all.
          
          🔄 Impactpool scraper will still run.
    
    - name: Send failure notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ ReliefWeb Scraper FAILED - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ❌ The ReliefWeb Nigeria job scraper has failed!
          
          🔍 Check the error log:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
