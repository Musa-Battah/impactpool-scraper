name: ReliefWeb Nigeria Jobs Scraper

on:
  schedule:
    # 10 AM Nigerian Time (9 AM UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Pull latest state
      run: git pull
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p job_outputs
    
    - name: Run ReliefWeb scraper
      id: scraper
      run: |
        python v13.py
        
        # Find generated CSV files
        CSV_FILE=$(ls job_outputs/nigeria_jobs_*.csv 2>/dev/null | head -1)
        REVIEW_FILE=$(ls job_outputs/nigeria_jobs_review_needed_*.csv 2>/dev/null | head -1)
        
        echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV
        echo "REVIEW_FILE=$REVIEW_FILE" >> $GITHUB_ENV
        
        if [ -n "$CSV_FILE" ]; then
          echo "✅ Found CSV: $CSV_FILE"
        else
          echo "ℹ️ No new jobs with valid locations"
        fi
        
        if [ -n "$REVIEW_FILE" ]; then
          echo "⚠️ Found review file: $REVIEW_FILE"
        fi
    
    # Save state file to Git (preserves 24-hour tracking)
    - name: Save state to repository
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add job_outputs/last_run_state.json
        git diff --staged --quiet || git commit -m "Update ReliefWeb scraper state [skip ci]"
        git push
    
    # Upload main CSV (jobs with valid locations)
    - name: Upload CSV artifact
      if: env.CSV_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: reliefweb-jobs-${{ github.run_id }}
        path: ${{ env.CSV_FILE }}
        retention-days: 30
    
    # Upload review file (jobs needing location review)
    - name: Upload review file artifact
      if: env.REVIEW_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: reliefweb-review-${{ github.run_id }}
        path: ${{ env.REVIEW_FILE }}
        retention-days: 30
    
    # Send email with results
    - name: Send email report
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🌍 ReliefWeb Nigeria Jobs - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ✅ ReliefWeb Nigeria job scraper completed successfully!
          
          📊 Run Details:
          - Time: $(date '+%Y-%m-%d %H:%M:%S') Nigerian Time
          - Run Number: ${{ github.run_number }}
          
          📁 Attached Files:
          ${{ env.CSV_FILE != '' && '✅ CSV with valid locations (ready to use)' || '❌ No new jobs with valid locations found' }}
          ${{ env.REVIEW_FILE != '' && '⚠️ Review file attached (jobs needing manual location check)' || '' }}
          
          📈 Quick Stats:
          ${{ env.CSV_FILE != '' && '- New jobs with Nigerian cities: See CSV' || '' }}
          ${{ env.REVIEW_FILE != '' && '- Jobs needing location review: Check review file' || '' }}
          
          🔗 View state file (24-hour tracking):
          https://github.com/${{ github.repository }}/blob/main/job_outputs/last_run_state.json
          
          🔗 View all artifacts:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ---
          This is an automated message from GitHub Actions.
          Your scraper runs daily at 10 AM Nigerian time.
        attachments: ${{ env.CSV_FILE != '' && env.CSV_FILE || '' }} ${{ env.REVIEW_FILE != '' && env.REVIEW_FILE || '' }}
    
    # Send failure notification
    - name: Send failure notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ ReliefWeb Scraper FAILED - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ❌ The ReliefWeb Nigeria job scraper has failed!
          
          🔍 Check the error log:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Possible issues to check:
          - API connection problem (ReliefWeb API down?)
          - Rate limiting (too many requests?)
          - Script error (check the logs above)
          - Missing dependencies (requests library?)
          
          📝 Last successful run state:
          https://github.com/${{ github.repository }}/blob/main/job_outputs/last_run_state.json
          
          Please investigate and fix the issue.
