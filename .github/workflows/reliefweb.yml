name: ReliefWeb Nigeria Jobs Scraper

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull latest changes
      run: git pull --rebase
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: mkdir -p job_outputs
    
    - name: Run ReliefWeb scraper
      id: scraper
      run: |
        python v13.py
        
        CSV_FILE=$(ls job_outputs/nigeria_jobs_*.csv 2>/dev/null | head -1)
        REVIEW_FILE=$(ls job_outputs/nigeria_jobs_review_needed_*.csv 2>/dev/null | head -1)
        
        echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV
        echo "REVIEW_FILE=$REVIEW_FILE" >> $GITHUB_ENV
        
        if [ -n "$CSV_FILE" ]; then
          echo "✅ Found CSV: $CSV_FILE"
        else
          echo "ℹ️ No new jobs with valid locations"
        fi
        
        if [ -n "$REVIEW_FILE" ]; then
          echo "⚠️ Found review file: $REVIEW_FILE"
        fi
    
    - name: Save state and processed IDs to repository
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add job_outputs/last_run_state.json
        git add job_outputs/_processed_ids.txt
        git diff --staged --quiet || git commit -m "Update ReliefWeb state and processed IDs [skip ci]"
        git pull --rebase
        for attempt in 1 2 3; do
          echo "Push attempt $attempt..."
          if git push; then
            echo "✅ Push succeeded on attempt $attempt"
            break
          else
            echo "⚠️ Push failed (attempt $attempt), waiting 5 seconds..."
            sleep 5
            git pull --rebase
          fi
          if [ $attempt -eq 3 ]; then
            echo "❌ Push failed after 3 attempts"
            exit 1
          fi
        done
    
    # ⭐ Send CSV directly to Next.js API (follows redirects)
    - name: Send CSV to Next.js API
      if: env.CSV_FILE != ''
      run: |
        echo "📤 Sending ReliefWeb CSV to Next.js API..."
        API_URL="https://oakjobs.online/api/csv/import"
        API_KEY="${{ secrets.CSV_IMPORT_API_KEY }}"
        
        RESPONSE=$(curl -s -L -w "\n%{http_code}" -X POST \
          "$API_URL" \
          -H "X-API-Key: $API_KEY" \
          -H "Content-Type: text/csv" \
          --data-binary "@${{ env.CSV_FILE }}" \
          --max-time 60)
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        echo "HTTP Status: $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
          echo "✅ CSV successfully imported to Next.js!"
          echo "Response: $BODY"
        else
          echo "⚠️ Warning: API returned HTTP $HTTP_CODE"
          echo "Response: $BODY"
        fi
    
    - name: Trigger Impactpool workflow
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: 'Musa-Battah',
            repo: 'impactpool-scraper',
            workflow_id: 'scraper.yml',
            ref: 'main'
          })
          console.log('✅ Impactpool workflow triggered successfully')
    
    - name: Upload CSV artifact
      if: env.CSV_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: reliefweb-jobs-${{ github.run_id }}
        path: ${{ env.CSV_FILE }}
        retention-days: 30
    
    - name: Upload review file artifact
      if: env.REVIEW_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: reliefweb-review-${{ github.run_id }}
        path: ${{ env.REVIEW_FILE }}
        retention-days: 30
    
    - name: Send email report
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "🌍 ReliefWeb Report - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ✅ ReliefWeb job scraper completed successfully!
          
          📊 Run Details:
          - Time: $(date '+%Y-%m-%d %H:%M:%S') Nigerian Time
          - Run Number: ${{ github.run_number }}
          - CSV File: ${{ env.CSV_FILE }}
          - Review File: ${{ env.REVIEW_FILE != '' && env.REVIEW_FILE || 'None' }}
          
          📤 CSV imported to Next.js: ${{ env.CSV_FILE != '' && '✅ Yes' || '❌ No (no jobs found)' }}
          
          🔄 Impactpool workflow triggered
          
          📁 CSV attached (backup)
        attachments: ${{ env.CSV_FILE != '' && env.CSV_FILE || '' }}
    
    - name: Send failure notification
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "❌ ReliefWeb Scraper FAILED - $(date +'%Y-%m-%d')"
        to: ${{ secrets.EMAIL_TO }}
        from: ReliefWeb Scraper <${{ secrets.EMAIL_USERNAME }}>
        body: |
          ❌ The ReliefWeb job scraper has failed!
          
          🔍 Check the error log:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
